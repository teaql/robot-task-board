version: '3.8'

services:
  db:
    image: postgres:16
    container_name: robot-task-board-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robot-task-board-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PG_HOST: db
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DBNAME: postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
